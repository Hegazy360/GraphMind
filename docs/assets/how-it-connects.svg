<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 236" width="100%" height="auto" role="img" aria-label="How GraphMind connects: your agent, wrapped by an adapter, sends events over a loopback WebSocket to graphmind serve, which stores them in SQLite and shows them in the viewer and to a coding agent over MCP. A held gate waits for the viewer's decision: continue, retry, inject or abort.">
  <defs>
    <marker id="hc-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#6b6b76"/></marker>
    <marker id="hc-arrow-accent" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#4ade80"/></marker>
  </defs>
  <g font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11.5">
    <!-- your process -->
    <rect x="8" y="22" width="222" height="124" rx="10" fill="#101015" stroke="#2a2a32"/>
    <text x="22" y="44" fill="#9a9aa4" font-size="10" letter-spacing="1.2">YOUR PROCESS</text>
    <rect x="22" y="56" width="194" height="34" rx="8" fill="#0c0c10" stroke="#3a3a44"/>
    <text x="119" y="77" text-anchor="middle" fill="#e6e6ea">your agent code</text>
    <rect x="22" y="100" width="194" height="34" rx="8" fill="rgba(74,222,128,0.12)" stroke="#4ade80"/>
    <text x="119" y="121" text-anchor="middle" fill="#4ade80">adapter · @graphmind-ai/*</text>

    <!-- debugger -->
    <rect x="300" y="22" width="190" height="124" rx="10" fill="#101015" stroke="#2a2a32"/>
    <text x="314" y="44" fill="#9a9aa4" font-size="10" letter-spacing="1.2">DEBUGGER</text>
    <rect x="314" y="56" width="162" height="34" rx="8" fill="#0c0c10" stroke="#3a3a44"/>
    <text x="395" y="77" text-anchor="middle" fill="#e6e6ea">graphmind serve</text>
    <rect x="314" y="100" width="162" height="34" rx="8" fill="#0c0c10" stroke="#2a2a32"/>
    <text x="395" y="121" text-anchor="middle" fill="#9a9aa4">SQLite · ~/.graphmind</text>

    <!-- consumers -->
    <rect x="560" y="22" width="192" height="124" rx="10" fill="#101015" stroke="#2a2a32"/>
    <text x="574" y="44" fill="#9a9aa4" font-size="10" letter-spacing="1.2">YOU</text>
    <rect x="574" y="56" width="164" height="34" rx="8" fill="#0c0c10" stroke="#3a3a44"/>
    <text x="656" y="77" text-anchor="middle" fill="#e6e6ea">viewer · browser</text>
    <rect x="574" y="100" width="164" height="34" rx="8" fill="#0c0c10" stroke="#2a2a32"/>
    <text x="656" y="121" text-anchor="middle" fill="#9a9aa4">coding agent · MCP</text>

    <!-- events: agent -> serve -->
    <line x1="230" y1="72" x2="296" y2="72" stroke="#6b6b76" stroke-width="1.4" marker-end="url(#hc-arrow)"/>
    <text x="263" y="62" text-anchor="middle" fill="#9a9aa4" font-size="9.5">events</text>
    <!-- serve -> viewer -->
    <line x1="490" y1="72" x2="556" y2="72" stroke="#6b6b76" stroke-width="1.4" marker-end="url(#hc-arrow)"/>
    <!-- decision: viewer -> serve -> gate -->
    <line x1="556" y1="117" x2="494" y2="117" stroke="#4ade80" stroke-width="1.4" stroke-dasharray="3 4" marker-end="url(#hc-arrow-accent)"/>
    <line x1="296" y1="117" x2="234" y2="117" stroke="#4ade80" stroke-width="1.4" stroke-dasharray="3 4" marker-end="url(#hc-arrow-accent)"/>
    <text x="263" y="107" text-anchor="middle" fill="#4ade80" font-size="9.5">decision</text>
    <text x="523" y="107" text-anchor="middle" fill="#4ade80" font-size="9.5">decision</text>

    <!-- loopback label -->
    <rect x="150" y="156" width="460" height="22" rx="11" fill="#101015" stroke="#2a2a32"/>
    <text x="380" y="171" text-anchor="middle" fill="#9a9aa4" font-size="10.5">everything on ws://127.0.0.1:4747 — nothing leaves the machine</text>

    <!-- the hold -->
    <rect x="8" y="186" width="744" height="42" rx="10" fill="#101015" stroke="#4ade80"/>
    <text x="380" y="205" text-anchor="middle" fill="#4ade80" font-size="11">a gate holds the call <tspan fill="#e6e6ea">before</tspan> the model or tool runs, for as long as you need</text>
    <text x="380" y="221" text-anchor="middle" fill="#9a9aa4" font-size="10.5">release it with continue · retry · inject · edit arguments · abort — no viewer attached? the gate is a no-op</text>
  </g>
</svg>
