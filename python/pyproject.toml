[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "graphmind-ai"
version = "0.4.4"
description = "Live debugger for AI agents — attach to a running Python agent, watch it as a graph, and pause/resume/inject at LLM and tool boundaries."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "GraphMind" }]
keywords = [
  "ai",
  "agents",
  "debugger",
  "observability",
  "llm",
  "langchain",
  "langgraph",
  "openai",
  "anthropic",
  "tracing",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Debuggers",
  "Typing :: Typed",
]
dependencies = ["websockets>=12"]

[project.urls]
Homepage = "https://graphmind.ai"
Repository = "https://github.com/Hegazy360/GraphMind"
Issues = "https://github.com/Hegazy360/GraphMind/issues"

[project.optional-dependencies]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.34"]
langchain = ["langchain-core>=0.3"]
all = ["openai>=1.40", "anthropic>=0.34", "langchain-core>=0.3"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-timeout>=2.3",
  "jsonschema>=4.20",
  "ruff>=0.6",
  "mypy>=1.11",
  "build>=1.2",
  "openai>=1.40",
  "anthropic>=0.34",
  "langchain-core>=0.3",
]

[tool.hatch.build.targets.wheel]
packages = ["graphmind"]

[tool.hatch.build.targets.sdist]
include = ["/graphmind", "/tests", "/README.md", "/LICENSE", "/Makefile"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC"]
ignore = [
  "B008",   # function call in default argument — not used
  "SIM105", # contextlib.suppress is slower than try/except on the hot path
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
ignore_missing_imports = true
files = ["graphmind"]
