<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; background: #0a0a0c; color: #f2f2f4;
    font-family: Inter, system-ui, sans-serif; overflow: hidden; position: relative;
  }
  .glow {
    position: absolute; width: 900px; height: 900px; border-radius: 50%;
    background: radial-gradient(circle, rgba(74,222,128,0.10), transparent 62%);
    top: -320px; right: -240px;
  }
  .grid {
    position: absolute; inset: 0;
    background-image: linear-gradient(#ffffff08 1px, transparent 1px),
                      linear-gradient(90deg, #ffffff08 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(circle at 30% 40%, #000 30%, transparent 78%);
  }
  .wrap { position: relative; padding: 72px 76px; height: 100%; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand svg { width: 44px; height: 44px; }
  .brand-name { font-size: 30px; font-weight: 600; letter-spacing: -0.02em; }
  h1 {
    font-size: 82px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.02;
    margin-top: 56px; max-width: 15ch;
  }
  .tag { font-size: 34px; color: #a7a7b0; margin-top: 22px; font-weight: 500; letter-spacing: -0.01em; }
  .foot { margin-top: auto; display: flex; align-items: center; gap: 18px; }
  .cmd {
    font-family: "SF Mono", ui-monospace, Menlo, monospace; font-size: 25px; color: #4ade80;
    background: #0c0c10; border: 1px solid #32323a; border-radius: 12px; padding: 15px 22px;
  }
  .meta { font-size: 22px; color: #85858f; letter-spacing: 0.02em; }
  .chip {
    position: absolute; right: 76px; top: 268px;
    display: flex; align-items: center; gap: 12px;
    background: rgba(248,113,113,0.10); border: 1px solid rgba(248,113,113,0.42);
    color: #f87171; border-radius: 999px; padding: 13px 24px; font-size: 23px; font-weight: 600;
  }
  .chip i { width: 11px; height: 11px; border-radius: 50%; background: #f87171; display: block; }
</style></head>
<body>
  <div class="glow"></div><div class="grid"></div>
  <div class="wrap">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M6 17 L12 6 M12 6 L19 14 M6 17 L19 14" stroke="#6b7280" stroke-width="1.6"/>
        <circle cx="6" cy="17" r="2.6" fill="#e6ece7"/>
        <circle cx="12" cy="6" r="2.6" fill="#4ade80"/>
        <circle cx="19" cy="14" r="2.6" fill="#e6ece7"/>
      </svg>
      <span class="brand-name">GraphMind</span>
    </div>
    <h1>The live debugger for AI agents.</h1>
    <p class="tag">Attaches while it&rsquo;s happening.</p>
    <div class="chip"><i></i> paused on error</div>
    <div class="foot">
      <span class="cmd">npx graphmind-ai demo</span>
      <span class="meta">MIT &middot; local-first &middot; graphmind.ai</span>
    </div>
  </div>
</body></html>
