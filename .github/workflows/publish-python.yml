# Publish the Python SDK to PyPI via Trusted Publishing (OIDC).
#
# No API token exists anywhere: PyPI is configured to trust this workflow, in
# this repository, and mints a short-lived credential at publish time. Runs on
# a v* tag, or on demand.
#
# SUPPLY-CHAIN NOTES
#   - The wheel and sdist are built FIRST, from the pristine checkout, with a
#     hash-pinned build toolchain (scripts/release/requirements-build.txt:
#     the front-end build + packaging + pyproject_hooks AND the backend
#     hatchling + pathspec + pluggy + tomlkit + trove-classifiers, sha256 per
#     wheel, `--require-hashes --only-binary :all:`) and `python -m build
#     --no-isolation`, so build cannot resolve `hatchling>=1.24` afresh from
#     PyPI into a throwaway venv. The test dependencies (`.[dev]`: pytest,
#     ruff, mypy, the provider SDKs...) are installed only AFTER dist/ exists,
#     so nothing in that much larger, range-pinned set can touch what ships.
#   - `twine check` is not run here on purpose: pypa/gh-action-pypi-publish
#     runs `twine check --strict` itself (`verify-metadata`, default true),
#     from its own pinned environment, so installing twine here would add ~20
#     unpinned packages to check the same thing twice.
#   - Why the dev set is NOT hash-pinned: it is ~60 wheels across several
#     platforms with native extensions (pydantic-core, jiter, ...), Dependabot
#     does not maintain hash lists, and it never touches the artifact. It runs
#     the tests against the artifact that was already built.
#   - The tests themselves are the gate: a red pytest means no upload.
name: Publish Python

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Least privilege: the default token is read-only for every job unless a job
# raises it itself (publish-python raises id-token for Trusted Publishing).
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write # required for Trusted Publishing; nothing else is granted
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Tag == pyproject version (and every other package in the repo)
        # Lockstep is the whole point of scripts/set-version.mjs; a tag that
        # names a version pyproject.toml does not carry must not upload.
        if: github.ref_type == 'tag'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.x'
      - name: Check versions
        if: github.ref_type == 'tag'
        env:
          REF_NAME: ${{ github.ref_name }} # via env, never interpolated into the shell
        run: node scripts/release/check-versions.mjs --tag "$REF_NAME"

      - name: Build wheel + sdist with a hash-pinned toolchain (front-end + backend)
        working-directory: python
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --only-binary :all: -r ../scripts/release/requirements-build.txt
          rm -rf dist
          # --no-isolation: build the wheel with the hatchling pinned above.
          # Without it, build creates a fresh venv and pip-installs whatever
          # `hatchling>=1.24` resolves to on PyPI that day — unpinned.
          python -m build --no-isolation
          ls -l dist

      - name: Test the package (after the artifact exists, so dev deps cannot touch it)
        working-directory: python
        run: |
          set -euo pipefail
          pip install -e '.[dev]'
          pytest -q

      # Proves the Trusted Publisher is configured WITHOUT uploading anything:
      # asks GitHub for an OIDC token and exchanges it at PyPI exactly as the
      # publish action would. Without this, a broken publisher configuration
      # stays invisible until the one moment it matters — a release that has
      # to ship. Advisory on its own; the publish step below is the gate.
      - name: Check trusted publishing is configured
        continue-on-error: true
        run: |
          set -uo pipefail
          claim="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=pypi" \
            | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')" || {
              echo "::warning::could not obtain an OIDC token from GitHub"; exit 0; }
          # The minted token is an upload credential: never echo the response.
          code="$(curl -sS -o /tmp/mint.json -w '%{http_code}' -X POST \
            https://pypi.org/_/oidc/mint-token \
            -H 'Content-Type: application/json' \
            -d "{\"token\": \"$claim\"}")"
          if [ "$code" = "200" ] && python -c 'import json,sys; sys.exit(0 if "token" in json.load(open("/tmp/mint.json")) else 1)'; then
            echo "::notice::Trusted publishing is configured — PyPI minted a short-lived upload token for this workflow."
          else
            echo "::warning::Trusted publishing is NOT configured (PyPI returned $code). Add a publisher at pypi.org/manage/account/publishing: project graphmind-ai, owner Hegazy360, repo GraphMind, workflow publish-python.yml, environment pypi."
            python -c 'import json; d=json.load(open("/tmp/mint.json")); print("reason:", d.get("message") or list(d)[:3])' 2>/dev/null || true
          fi
          rm -f /tmp/mint.json

      # Releases used to be published by hand from the maintainer's machine,
      # so by the time the tag landed the version was usually already on PyPI.
      # Without this check the job fails on the OIDC exchange and reports a
      # red X for a release that actually shipped — a false alarm that trains
      # you to ignore the one alarm that matters.
      - name: Is this version already on PyPI?
        id: existing
        working-directory: python
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if curl -fsS "https://pypi.org/pypi/graphmind-ai/$VERSION/json" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::graphmind-ai $VERSION is already on PyPI — nothing to upload. Re-running for a released version is a no-op."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # Only runs for a version that is genuinely unpublished — so this step
      # going red means a real release could not ship, which is worth waking
      # up for. It needs a Trusted Publisher configured at
      # pypi.org/manage/account/publishing:
      #   project graphmind-ai · owner Hegazy360 · repo GraphMind
      #   workflow publish-python.yml · environment pypi
      # The action also verifies metadata (`twine check --strict`) and, from
      # a Trusted Publisher, attaches PEP 740 attestations automatically —
      # visible at https://pypi.org/project/graphmind-ai/<version>/#files and
      # https://pypi.org/integrity/graphmind-ai/<version>/<filename>/provenance
      - name: Publish to PyPI
        if: steps.existing.outputs.published == 'false'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2/v1
        with:
          packages-dir: python/dist
          # A re-run of an already-published version should be a no-op, not a
          # red build.
          skip-existing: true
