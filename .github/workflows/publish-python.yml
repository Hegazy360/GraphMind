# Publish the Python SDK to PyPI via Trusted Publishing (OIDC).
#
# No API token exists anywhere: PyPI is configured to trust this workflow, in
# this repository, and mints a short-lived credential at publish time. Runs on
# a v* tag, or on demand.
name: Publish Python

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write # required for Trusted Publishing; nothing else is granted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify the package before publishing
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pytest -q

      - name: Build wheel + sdist
        working-directory: python
        run: |
          pip install build twine
          rm -rf dist
          python -m build
          python -m twine check dist/*
          ls -l dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
          # A re-run of an already-published version should be a no-op, not a
          # red build.
          skip-existing: true
