# OpenSSF Scorecard: an automated, public read of this repository's supply-chain
# hygiene (branch protection, pinned dependencies, token permissions, signed
# releases, dangerous workflow patterns, ...). Security teams at adopting
# companies check the score before they check the code, so it is better to
# publish it and fix what it flags than to be scored blind.
#
# Results go to the Security tab (SARIF) and to the public Scorecard API, which
# the README badge reads.
name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '23 6 * * 1' # weekly, Monday 06:23 UTC
  # Default branch only: `publish_results` is refused from any other ref, so
  # running this on `main` (kept in sync with `master` but not the default)
  # produced a failing run beside every passing one.
  push:
    branches: [master]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Needed to upload the results to code-scanning.
      security-events: write
      # Needed to publish results and get a badge (see publish_results below).
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishes to the Scorecard API for a public repo. No token needed;
          # the workflow's own OIDC identity is the credential.
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: results.sarif
