# Deploy the docs site (apps/docs) to Vercel.
#
# WHY THIS EXISTS
#   The Vercel project `graphmind-docs` is not connected to this repository, so
#   nothing deploys when master changes: the site is whatever was last pushed
#   from someone's terminal. It fell 55 days behind master once (seven pages,
#   including the 0.6.0 ones, missing from graphmind.ai/docs). This workflow
#   makes a docs change on master reach production on its own.
#
# ONE SECRET (Settings → Secrets and variables → Actions)
#   VERCEL_TOKEN        Vercel → Account settings → Tokens (scope: the team)
# The team and project ids are not secrets; they are pinned below so the
# workflow cannot silently deploy to the wrong project. Both come from
# `vercel link` in apps/docs (.vercel/project.json).
#
# The build happens here, not on Vercel: `vercel build` runs `astro build` in
# the already-installed workspace and `vercel deploy --prebuilt` uploads the
# output, so what the link checker saw is exactly what goes live.
name: Deploy docs

on:
  push:
    branches: [master]
    paths:
      - 'apps/docs/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-docs
  cancel-in-progress: true # only the newest docs matter

env:
  GRAPHMIND_TELEMETRY: '0'
  VERCEL_ORG_ID: team_Dp8LiV7XQFRYPkyucddtu5Na # hegazy360s-projects
  VERCEL_PROJECT_ID: prj_20Bpu7TrkQSoNnZHkeJzuWAFmCB6 # graphmind-docs

jobs:
  deploy:
    name: build, check links, deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up pnpm (corepack, pinned by packageManager)
        run: |
          corepack enable
          corepack prepare --activate

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.x'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build and check links
        run: |
          pnpm --filter docs build
          pnpm --filter docs check:links

      - name: Refuse to deploy without the Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::VERCEL_TOKEN is not set — add it under Settings → Secrets and variables → Actions (see the header of this file)."
            exit 1
          fi

      - name: Deploy to production
        working-directory: apps/docs
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
          url=$(npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "- Docs deployed: $url (served at https://graphmind.ai/docs)" >> "$GITHUB_STEP_SUMMARY"
