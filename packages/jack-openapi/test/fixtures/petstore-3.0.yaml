# A faithful subset of the Swagger Petstore v3 document
# (https://petstore3.swagger.io/api/v3/openapi.json), trimmed for tests.
# Keeps what matters to the compiler: a RELATIVE server, tags, $refs,
# readOnly ids, oauth2 scopes, an apiKey header, a deprecated operation and
# an octet-stream upload that Jack cannot proxy yet.
openapi: 3.0.4
info:
  title: Swagger Petstore - OpenAPI 3.0
  description: This is a sample Pet Store Server based on the OpenAPI 3.0 specification.
  version: 1.0.27
servers:
  - url: /api/v3
tags:
  - name: pet
  - name: store
  - name: user
paths:
  /pet:
    put:
      tags: [pet]
      summary: Update an existing pet.
      description: Update an existing pet by Id.
      operationId: updatePet
      requestBody:
        description: Update an existent pet in the store
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Pet' }
          application/xml:
            schema: { $ref: '#/components/schemas/Pet' }
      responses: { '200': { description: Successful operation } }
      security:
        - petstore_auth: [write:pets, read:pets]
    post:
      tags: [pet]
      summary: Add a new pet to the store.
      description: Add a new pet to the store.
      operationId: addPet
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Pet' }
      responses: { '200': { description: Successful operation } }
      security:
        - petstore_auth: [write:pets, read:pets]
  /pet/findByStatus:
    get:
      tags: [pet]
      summary: Finds Pets by status.
      description: Multiple status values can be provided with comma separated strings.
      operationId: findPetsByStatus
      parameters:
        - name: status
          in: query
          description: Status values that need to be considered for filter
          required: true
          schema:
            type: string
            default: available
            enum: [available, pending, sold]
      responses: { '200': { description: successful operation } }
      security:
        - petstore_auth: [write:pets, read:pets]
  /pet/findByTags:
    get:
      tags: [pet]
      summary: Finds Pets by tags.
      operationId: findPetsByTags
      deprecated: true
      parameters:
        - name: tags
          in: query
          schema: { type: array, items: { type: string } }
      responses: { '200': { description: successful operation } }
  /pet/{petId}:
    get:
      tags: [pet]
      summary: Find pet by ID.
      description: Returns a single pet.
      operationId: getPetById
      parameters:
        - $ref: '#/components/parameters/PetId'
      responses: { '200': { description: successful operation } }
      security:
        - api_key: []
        - petstore_auth: [write:pets, read:pets]
    delete:
      tags: [pet]
      summary: Deletes a pet.
      operationId: deletePet
      parameters:
        - name: api_key
          in: header
          schema: { type: string }
        - $ref: '#/components/parameters/PetId'
      responses: { '200': { description: Pet deleted } }
      security:
        - petstore_auth: [write:pets, read:pets]
  /pet/{petId}/uploadImage:
    post:
      tags: [pet]
      summary: Uploads an image.
      operationId: uploadFile
      parameters:
        - $ref: '#/components/parameters/PetId'
      requestBody:
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses: { '200': { description: successful operation } }
  /store/inventory:
    get:
      tags: [store]
      summary: Returns pet inventories by status.
      operationId: getInventory
      responses: { '200': { description: successful operation } }
      security:
        - api_key: []
  /user/login:
    get:
      tags: [user]
      summary: Logs user into the system.
      operationId: loginUser
      parameters:
        - { name: username, in: query, schema: { type: string } }
        - { name: password, in: query, schema: { type: string } }
      responses: { '200': { description: successful operation } }
components:
  parameters:
    PetId:
      name: petId
      in: path
      description: ID of pet
      required: true
      schema: { type: integer, format: int64 }
  schemas:
    Category:
      type: object
      properties:
        id: { type: integer, format: int64, example: 1 }
        name: { type: string, example: Dogs }
    Tag:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
    Pet:
      required: [name, photoUrls]
      type: object
      properties:
        id: { type: integer, format: int64, readOnly: true, example: 10 }
        name: { type: string, example: doggie }
        category: { $ref: '#/components/schemas/Category' }
        photoUrls: { type: array, items: { type: string } }
        tags: { type: array, items: { $ref: '#/components/schemas/Tag' } }
        status:
          type: string
          description: pet status in the store
          nullable: true
          enum: [available, pending, sold]
  securitySchemes:
    petstore_auth:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://petstore3.swagger.io/oauth/authorize
          scopes:
            write:pets: modify pets in your account
            read:pets: read your pets
    api_key:
      type: apiKey
      name: api_key
      in: header
